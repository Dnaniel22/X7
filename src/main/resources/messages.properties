# =====================================================================
#  Mensajes de validación (Spring Validator)
#  Las anotaciones del modelo usan la clave entre llaves, por ejemplo:
#  @NotBlank(message = "{producto.nombre.obligatorio}")
#  {min}, {max} y {value} se reemplazan con los valores de la anotación.
# =====================================================================

# ---------------------------- Usuario ----------------------------
usuario.nombre.obligatorio=El nombre es obligatorio.
usuario.nombre.tamano=El nombre debe tener entre {min} y {max} caracteres.
usuario.email.obligatorio=El correo electrónico es obligatorio.
usuario.email.formato=Ingresa un correo válido, por ejemplo maria@correo.com.
usuario.email.tamano=El correo no puede superar los {max} caracteres.
usuario.email.duplicado=Ya existe una cuenta registrada con ese correo.
usuario.telefono.formato=El teléfono debe tener 9 dígitos y empezar con 9.
usuario.direccion.tamano=La dirección no puede superar los {max} caracteres.
usuario.password.obligatorio=La contraseña es obligatoria.
usuario.password.tamano=La contraseña debe tener entre {min} y {max} caracteres.
usuario.password.confirmar=Vuelve a escribir la contraseña.
usuario.password.noCoincide=Las contraseñas no coinciden.
usuario.terminos.obligatorio=Debes aceptar los términos y condiciones para crear tu cuenta.
usuario.rol.obligatorio=El rol es obligatorio.

