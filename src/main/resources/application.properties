spring.application.name=pasteleria-x7
server.port=8080
spring.thymeleaf.cache=false
# La sesión viaja solo en la cookie JSESSIONID (sin ";jsessionid=..." en las URLs).
server.servlet.session.tracking-modes=cookie

# ================== Conexión con PostgreSQL (pgAdmin) ==================
# 1. En pgAdmin crea la base de datos "pasteleria_x7" (o ejecuta database/01_crear_base_datos.sql).
# 2. Escribe aquí el usuario y la contraseña que definiste al instalar PostgreSQL.
#    El puerto por defecto de PostgreSQL es 5432.
spring.datasource.url=jdbc:postgresql://localhost:5432/pasteleria_x7
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================== JPA / Hibernate ==================
# update: Hibernate crea las tablas la primera vez y luego solo agrega lo que falte,
# sin borrar los datos. Por eso los registros se conservan al reiniciar la aplicación.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que genera Hibernate (útil para las evidencias).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Las relaciones se cargan en el repositorio (con @EntityGraph), no al renderizar la vista.
spring.jpa.open-in-view=false
# Crea las restricciones UNIQUE solo si faltan (evita recrearlas en cada arranque).
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY

# ================== Mensajes ==================
# messages.properties centraliza los mensajes de validación (Spring Validator).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
