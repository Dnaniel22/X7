spring.application.name=pasteleria-x7
server.port=8080

# ---------- Vistas (Thymeleaf) ----------
spring.thymeleaf.cache=false

# Permite usar th:method="put" y th:method="delete" en los formularios HTML
spring.mvc.hiddenmethod.filter.enabled=true

# El identificador de sesion viaja solo en la cookie, nunca en la URL
server.servlet.session.tracking-modes=cookie

# ---------- Persistencia (base de datos H2 en archivo) ----------
# Los datos quedan guardados en ./data/pasteleriax7.mv.db y sobreviven al reinicio.
spring.datasource.url=jdbc:h2:file:./data/pasteleriax7;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Consola web de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
