<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card card-modern p-4 text-center">
          <span class="badge badge-gold mb-3 mx-auto"><i class="bi bi-person-fill"></i> Cliente Registrado</span>
          <h3 class="font-serif fw-bold mb-1">Bienvenido de Nuevo</h3>
          <p class="text-muted small mb-4">
            Ingresa con tu cuenta para revisar el estado de tus pedidos. Si eres administrador,
            usa tus credenciales y serás redirigido al panel de gestión.
          </p>

          <div th:if="${error}" class="alert alert-danger text-start small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3 text-start">
              <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
              <input type="email" id="email" name="email" class="form-control"
                     th:value="${email}" placeholder="maria@correo.com" required>
            </div>

            <div class="mb-3 text-start">
              <label for="password" class="form-label small fw-semibold">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control"
                     placeholder="••••••••" required>
            </div>

            <button class="btn btn-terracotta w-100 py-3 fw-bold mb-3" type="submit">
              <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>
          </form>

          <p class="text-center small text-muted mb-1">¿Aún no tienes cuenta?
            <a th:href="@{/registro}" class="fw-semibold text-decoration-none">Regístrate aquí</a>
          </p>
          <a th:href="@{/}" class="text-decoration-none text-muted small mt-2">
            <i class="bi bi-arrow-left"></i> Volver a la web
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
