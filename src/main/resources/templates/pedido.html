<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Encargar Pedido')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('pedido')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <h2 class="font-serif fw-bold">Solicitud de Pedido</h2>
            <p class="text-muted small">Llena los datos requeridos para procesar la cotización de tu pedido.</p>
          </div>

          <form th:action="@{/pedido}" th:object="${pedidoForm}" method="post" novalidate>

            <!-- Resumen de errores de validación devueltos por el servidor -->
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Revisa los campos marcados en rojo antes de continuar.
            </div>

            <h5 class="fw-bold mb-3 text-danger"><i class="bi bi-person me-2"></i>1. Datos de Contacto</h5>
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="nombreContacto" class="form-label small fw-semibold">Nombre Completo *</label>
                <input type="text" id="nombreContacto" th:field="*{nombreContacto}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Ej. Ana Torres">
                <div class="invalid-feedback" th:errors="*{nombreContacto}"></div>
              </div>
              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label small fw-semibold">Teléfono / WhatsApp *</label>
                <input type="tel" id="telefono" th:field="*{telefono}" th:errorclass="is-invalid"
                       class="form-control" placeholder="987654321">
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
              </div>
              <div class="col-12">
                <label for="direccion" class="form-label small fw-semibold">Dirección de Entrega en Ica *</label>
                <input type="text" id="direccion" th:field="*{direccion}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Urb. La Angostura Mz. B Lt. 4, Ica">
                <div class="invalid-feedback" th:errors="*{direccion}"></div>
              </div>
            </div>

            <h5 class="fw-bold mb-3 text-danger">
              <i class="bi bi-cake2 me-2"></i>2. Especificaciones de la Torta o Bocaditos
            </h5>
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="producto" class="form-label small fw-semibold">Tipo de Producto *</label>
                <select id="producto" th:field="*{producto}" th:errorclass="is-invalid" class="form-select">
                  <option value="">Seleccione...</option>
                  <option th:each="p : ${productos}"
                          th:value="${p.nombre}"
                          th:attr="data-precio=${p.precio}"
                          th:text="${p.nombre} + ' — S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">
                    Producto
                  </option>
                  <option th:value="${productoPersonalizado}" th:text="${productoPersonalizado}">Otro</option>
                </select>
                <div class="invalid-feedback" th:errors="*{producto}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaEntrega" class="form-label small fw-semibold">Fecha de Entrega *</label>
                <input type="date" id="fechaEntrega" th:field="*{fechaEntrega}" th:errorclass="is-invalid"
                       th:attr="min=${fechaMinima}" class="form-control">
                <div class="invalid-feedback" th:errors="*{fechaEntrega}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="tamano" class="form-label small fw-semibold">Tamaño de la Torta *</label>
                <select id="tamano" th:field="*{tamano}" th:errorclass="is-invalid" class="form-select">
                  <option value="">Seleccione...</option>
                  <option th:each="t : ${tamanos}"
                          th:value="${t}"
                          th:attr="data-factor=${t.factor}"
                          th:text="${t.etiqueta}">Tamaño</option>
                </select>
                <div class="invalid-feedback" th:errors="*{tamano}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="cantidad" class="form-label small fw-semibold">Cantidad *</label>
                <input type="number" id="cantidad" th:field="*{cantidad}" th:errorclass="is-invalid"
                       class="form-control" min="1" max="50">
                <div class="invalid-feedback" th:errors="*{cantidad}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="colores" class="form-label small fw-semibold">Colores / Temática</label>
                <input type="text" id="colores" th:field="*{colores}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Ej. Tono Rose Gold y Flores">
                <div class="invalid-feedback" th:errors="*{colores}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="totalEstimado" class="form-label small fw-semibold">Total Estimado</label>
                <input type="text" id="totalEstimado" class="form-control fw-bold text-danger"
                       value="Por confirmar" readonly>
                <div class="form-text">El monto final lo confirma la pastelería.</div>
              </div>

              <div class="col-12">
                <label for="detalles" class="form-label small fw-semibold">Detalles Especiales</label>
                <textarea id="detalles" th:field="*{detalles}" th:errorclass="is-invalid"
                          class="form-control" rows="3"
                          placeholder="Dedicatoria o sabores preferidos..."></textarea>
                <div class="invalid-feedback" th:errors="*{detalles}"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-terracotta w-100 py-3 fw-bold">
              <i class="bi bi-check-circle me-2"></i> Confirmar y Registrar Pedido
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div th:if="${mostrarModalAuth}"
       th:replace="~{fragments/layout :: modalAuth(
         'Necesitas una cuenta para encargar un pedido',
         'Así podemos guardar tu pedido en tu cuenta y que puedas revisar su estado cuando quieras.')}"></div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  <script th:if="${mostrarModalAuth}">
    document.addEventListener("DOMContentLoaded", function () {
      new bootstrap.Modal(document.getElementById("modalAuth")).show();
    });
  </script>

</body>
</html>
