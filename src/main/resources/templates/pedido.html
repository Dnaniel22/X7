<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Encargar Pedido')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('pedido')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <h2 class="font-serif fw-bold">Solicitud de Pedido</h2>
            <p class="text-muted small">Llena los datos requeridos para procesar la cotización de tu pedido.</p>
          </div>

          <!--
            El formulario se enlaza a PedidoForm con th:object.
            Spring Validator revisa los datos (@Valid) y th:errors muestra cada mensaje bajo su campo.
          -->
          <form th:action="@{/pedido}" th:object="${pedido}" method="post" novalidate>

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Revisa los campos marcados en rojo.
            </div>

            <h5 class="fw-bold mb-3 text-danger"><i class="bi bi-person me-2"></i>1. Datos de Contacto</h5>
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="nombreContacto" class="form-label small fw-semibold">Nombre Completo *</label>
                <input type="text" id="nombreContacto" th:field="*{nombreContacto}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombreContacto')} ? 'is-invalid'"
                       placeholder="Ej. Ana Torres" maxlength="100" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombreContacto')}" th:errors="*{nombreContacto}">Error</div>
              </div>
              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label small fw-semibold">Teléfono / WhatsApp *</label>
                <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                       placeholder="987654321" maxlength="9" inputmode="numeric" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Error</div>
              </div>
              <div class="col-12">
                <label for="direccion" class="form-label small fw-semibold">Dirección de Entrega en Ica *</label>
                <input type="text" id="direccion" th:field="*{direccion}" class="form-control"
                       th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'"
                       placeholder="Urb. La Angostura Mz. B Lt. 4, Ica" maxlength="200" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}">Error</div>
              </div>
            </div>

            <h5 class="fw-bold mb-3 text-danger">
              <i class="bi bi-cake2 me-2"></i>2. Especificaciones de la Torta o Bocaditos
            </h5>
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="productoId" class="form-label small fw-semibold">Tipo de Producto *</label>
                <select id="productoId" th:field="*{productoId}" class="form-select"
                        th:classappend="${#fields.hasErrors('productoId')} ? 'is-invalid'" required>
                  <option value="">Seleccione...</option>
                  <!-- Los productos salen de la tabla producto (solo los disponibles) -->
                  <option th:each="p : ${productos}"
                          th:value="${p.id}"
                          th:attr="data-precio=${p.precio},data-categoria=${p.categoria}"
                          th:text="${p.nombre} + ' — S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">
                    Producto
                  </option>
                  <option th:value="0">Otro / Personalizado</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('productoId')}" th:errors="*{productoId}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaEntrega" class="form-label small fw-semibold">Fecha de Entrega *</label>
                <input type="date" id="fechaEntrega" th:field="*{fechaEntrega}" class="form-control"
                       th:classappend="${#fields.hasErrors('fechaEntrega')} ? 'is-invalid'"
                       th:min="${fechaMinima}" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fechaEntrega')}" th:errors="*{fechaEntrega}">Error</div>
              </div>

              <!-- Solo se muestra cuando el producto elegido es una torta (app.js) -->
              <div class="col-12 col-md-6" id="grupoTamano">
                <label for="tamano" class="form-label small fw-semibold">Tamaño de la Torta *</label>
                <select id="tamano" th:field="*{tamano}" class="form-select"
                        th:classappend="${#fields.hasErrors('tamano')} ? 'is-invalid'" required>
                  <option value="">Seleccione...</option>
                  <option th:each="t : ${tamanos}" th:value="${t.key}"
                          th:attr="data-factor=${t.value}" th:text="${t.key}">Tamaño</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tamano')}" th:errors="*{tamano}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="cantidad" class="form-label small fw-semibold">Cantidad *</label>
                <input type="number" id="cantidad" th:field="*{cantidad}" class="form-control"
                       th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'"
                       min="1" max="50" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="colores" class="form-label small fw-semibold">Colores / Temática</label>
                <input type="text" id="colores" th:field="*{colores}" class="form-control"
                       th:classappend="${#fields.hasErrors('colores')} ? 'is-invalid'"
                       placeholder="Ej. Tono Rose Gold y Flores" maxlength="100">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('colores')}" th:errors="*{colores}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="totalEstimado" class="form-label small fw-semibold">Total Estimado</label>
                <input type="text" id="totalEstimado" class="form-control fw-bold text-danger"
                       value="Por confirmar" readonly>
                <div class="form-text">El monto final lo confirma la pastelería.</div>
              </div>

              <div class="col-12">
                <label for="detalles" class="form-label small fw-semibold">Detalles Especiales</label>
                <textarea id="detalles" th:field="*{detalles}" class="form-control" rows="3"
                          th:classappend="${#fields.hasErrors('detalles')} ? 'is-invalid'"
                          placeholder="Dedicatoria o sabores preferidos..." maxlength="500"></textarea>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('detalles')}" th:errors="*{detalles}">Error</div>
              </div>
            </div>

            <button type="submit" class="btn btn-terracotta w-100 py-3 fw-bold">
              <i class="bi bi-check-circle me-2"></i> Confirmar y Registrar Pedido
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div th:if="${mostrarModalAuth}"
       th:replace="~{fragments/layout :: modalAuth(
         'Necesitas una cuenta para encargar un pedido',
         'Así podemos guardar tu pedido en tu cuenta y que puedas revisar su estado cuando quieras.')}"></div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  <script th:if="${mostrarModalAuth}">
    document.addEventListener("DOMContentLoaded", function () {
      new bootstrap.Modal(document.getElementById("modalAuth")).show();
    });
  </script>

</body>
</html>
