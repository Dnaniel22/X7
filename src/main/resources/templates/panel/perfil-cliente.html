<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis Datos')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-7">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <nav aria-label="breadcrumb">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/cliente/panel}" class="text-decoration-none">Mi Panel</a></li>
            <li class="breadcrumb-item active" aria-current="page">Mis datos</li>
          </ol>
        </nav>

        <div class="card card-modern p-4">
          <div class="mb-4">
            <h2 class="font-serif fw-bold mb-1">Editar mis datos</h2>
            <p class="text-muted small mb-0">
              Actualiza tu información de contacto. Se usará para tus próximos pedidos.
            </p>
          </div>

          <!-- Actualización (UPDATE) mediante el verbo HTTP PUT -->
          <form th:action="@{/cliente/perfil}" th:object="${perfilForm}" th:method="put" novalidate>

            <div class="alert alert-danger small" role="alert" th:if="${#fields.hasAnyErrors()}">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Revisa los campos marcados en rojo antes de guardar.
            </div>

            <div class="row g-3">
              <div class="col-12">
                <label for="nombre" class="form-label small fw-semibold">Nombre Completo *</label>
                <input type="text" id="nombre" th:field="*{nombre}" th:errorclass="is-invalid" class="form-control">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
              </div>

              <div class="col-12">
                <label for="email" class="form-label small fw-semibold">Correo Electrónico *</label>
                <input type="email" id="email" th:field="*{email}" th:errorclass="is-invalid" class="form-control">
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label small fw-semibold">Teléfono / WhatsApp *</label>
                <input type="tel" id="telefono" th:field="*{telefono}" th:errorclass="is-invalid" class="form-control">
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="direccion" class="form-label small fw-semibold">Dirección (Ica) *</label>
                <input type="text" id="direccion" th:field="*{direccion}" th:errorclass="is-invalid" class="form-control">
                <div class="invalid-feedback" th:errors="*{direccion}"></div>
              </div>

              <div class="col-12">
                <label for="passwordNuevo" class="form-label small fw-semibold">Nueva contraseña</label>
                <input type="password" id="passwordNuevo" th:field="*{passwordNuevo}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Déjala vacía si no quieres cambiarla">
                <div class="invalid-feedback" th:errors="*{passwordNuevo}"></div>
                <div class="form-text">Solo se cambia si escribes una nueva (mínimo 6 caracteres).</div>
              </div>
            </div>

            <div class="d-flex gap-3 mt-4">
              <a th:href="@{/cliente/panel}" class="btn btn-outline-burgundy flex-fill">Cancelar</a>
              <button type="submit" class="btn btn-terracotta flex-fill fw-bold">
                <i class="bi bi-check-circle me-1"></i> Guardar cambios
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
