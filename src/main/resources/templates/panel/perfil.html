<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis Datos')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <span class="badge badge-gold mb-3"><i class="bi bi-person-gear"></i> Mi Cuenta</span>
            <h3 class="font-serif fw-bold mb-1">Editar mis Datos</h3>
            <p class="text-muted small">Estos datos se usan para completar tus pedidos automáticamente.</p>
          </div>

          <!-- Actualiza la fila del usuario en PostgreSQL (UPDATE usuario ...) -->
          <form th:action="@{/cliente/perfil}" th:object="${perfil}" method="post" novalidate>

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Revisa los campos marcados en rojo.
            </div>

            <div class="row g-3 mb-4">
              <div class="col-12">
                <label for="nombre" class="form-label small fw-semibold">Nombre Completo *</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="100" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
              </div>

              <div class="col-12">
                <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" th:value="${email}" disabled>
                <div class="form-text">El correo identifica tu cuenta y no se puede cambiar.</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label small fw-semibold">Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                       placeholder="987654321" maxlength="9" inputmode="numeric">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="direccion" class="form-label small fw-semibold">Dirección (Ica)</label>
                <input type="text" id="direccion" th:field="*{direccion}" class="form-control"
                       th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'"
                       placeholder="Urb. Las Flores Mz. A" maxlength="150">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}">Error</div>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2">
              <button class="btn btn-terracotta flex-fill fw-bold" type="submit">
                <i class="bi bi-check-circle me-1"></i> Guardar cambios
              </button>
              <a th:href="@{/cliente/panel}" class="btn btn-outline-burgundy flex-fill">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
