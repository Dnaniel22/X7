<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbarAdmin}"></nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <nav aria-label="breadcrumb">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item">
              <a th:href="@{/admin/panel(tab='productos')}" class="text-decoration-none">Productos</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${producto.id == null} ? 'Nuevo' : 'Editar'">Nuevo</li>
          </ol>
        </nav>

        <div class="card card-modern p-4">
          <div class="mb-4">
            <h2 class="font-serif fw-bold mb-1"
                th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'">Nuevo Producto</h2>
            <p class="text-muted small mb-0">
              Los campos marcados con * son obligatorios y se validan en el servidor.
            </p>
          </div>

          <!--
            Un mismo formulario sirve para CREATE (POST) y UPDATE (PUT).
            Thymeleaf añade el campo oculto _method cuando el verbo no es GET ni POST.
          -->
          <form th:object="${producto}"
                th:action="${producto.id == null} ? @{/admin/productos} : @{/admin/productos/{id}(id=${producto.id})}"
                th:method="${producto.id == null} ? 'post' : 'put'"
                novalidate>

            <div class="alert alert-danger small" role="alert" th:if="${#fields.hasAnyErrors()}">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Revisa los campos marcados en rojo antes de guardar.
            </div>

            <div class="row g-3">
              <div class="col-12">
                <label for="nombre" class="form-label small fw-semibold">Nombre del Producto *</label>
                <input type="text" id="nombre" th:field="*{nombre}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Ej. Torta Red Velvet Clásica">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="categoria" class="form-label small fw-semibold">Categoría *</label>
                <select id="categoria" th:field="*{categoria}" th:errorclass="is-invalid" class="form-select">
                  <option value="">Seleccione...</option>
                  <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoría</option>
                </select>
                <div class="invalid-feedback" th:errors="*{categoria}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="precio" class="form-label small fw-semibold">Precio (S/) *</label>
                <input type="number" id="precio" th:field="*{precio}" th:errorclass="is-invalid"
                       class="form-control" step="0.01" min="0.01" placeholder="Ej. 95.00">
                <div class="invalid-feedback" th:errors="*{precio}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="etiqueta" class="form-label small fw-semibold">Etiqueta / Badge</label>
                <input type="text" id="etiqueta" th:field="*{etiqueta}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Ej. Más vendido">
                <div class="invalid-feedback" th:errors="*{etiqueta}"></div>
                <div class="form-text">Si la dejas vacía se usará la categoría.</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="imagen" class="form-label small fw-semibold">Imagen (URL)</label>
                <input type="url" id="imagen" th:field="*{imagen}" th:errorclass="is-invalid"
                       class="form-control js-preview-origen" placeholder="https://...">
                <div class="invalid-feedback" th:errors="*{imagen}"></div>
              </div>

              <div class="col-12">
                <label for="descripcion" class="form-label small fw-semibold">Descripción *</label>
                <textarea id="descripcion" th:field="*{descripcion}" th:errorclass="is-invalid"
                          class="form-control" rows="3"
                          placeholder="Breve descripción del producto (mínimo 10 caracteres)..."></textarea>
                <div class="invalid-feedback" th:errors="*{descripcion}"></div>
              </div>

              <div class="col-12" id="previewWrapper"
                   th:classappend="${#strings.isEmpty(producto.imagen)} ? 'd-none'">
                <p class="small text-muted mb-1">Vista previa</p>
                <img th:src="*{imagen}" id="previewImagen" alt="Vista previa del producto"
                     class="rounded-3 border" style="width:140px;height:140px;object-fit:cover;">
              </div>
            </div>

            <div class="d-flex gap-3 mt-4">
              <a th:href="@{/admin/panel(tab='productos')}" class="btn btn-outline-burgundy flex-fill">Cancelar</a>
              <button type="submit" class="btn btn-terracotta flex-fill fw-bold">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${producto.id == null} ? 'Guardar Producto' : 'Guardar Cambios'">Guardar</span>
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
