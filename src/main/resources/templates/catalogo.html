<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Catálogo Digital')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('catalogo')}"></nav>

  <div class="container py-5">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold font-serif">Catálogo Digital</h1>
      <p class="text-muted">Explora nuestras elaboraciones y solicita tu pedido en línea</p>
    </div>

    <!-- Buscador y filtros (las categorías salen de la base de datos) -->
    <div class="row g-3 mb-5 align-items-center">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" id="buscadorProductos" class="form-control border-start-0 ps-0"
                 placeholder="Buscar por nombre, sabor o tipo de evento...">
        </div>
      </div>
      <div class="col-md-6 text-md-end">
        <div class="btn-group flex-wrap" role="group">
          <button type="button" class="btn btn-terracotta btn-sm" data-categoria="">Todos</button>
          <button type="button" class="btn btn-outline-burgundy btn-sm"
                  th:each="categoria : ${categorias}"
                  th:attr="data-categoria=${categoria}"
                  th:text="${categoria}">Categoría</button>
        </div>
      </div>
    </div>

    <!-- Grilla de productos renderizada por Thymeleaf -->
    <div class="row g-4" id="grillaProductos">
      <div class="col-12 col-md-6 col-lg-4 producto-card" th:each="p : ${productos}"
           th:attr="data-categoria=${p.categoria},data-texto=${p.nombre + ' ' + p.descripcion + ' ' + p.categoria}">
        <div class="card card-modern h-100 p-3">
          <img th:src="${p.imagen} ?: 'https://via.placeholder.com/600x400?text=Pasteleria+X7'"
               th:alt="${p.nombre}" class="card-img-top rounded-3"
               style="height:220px;object-fit:cover;">
          <div class="card-body px-1">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge badge-gold" th:text="${p.etiqueta}">Producto</span>
              <span class="fw-bold fs-5 text-danger">
                S/ <span th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span>
              </span>
            </div>
            <h5 class="fw-bold" th:text="${p.nombre}">Nombre</h5>
            <p class="small text-muted" th:text="${p.descripcion}">Descripción</p>
          </div>
          <div class="card-footer bg-transparent border-0 px-1 pt-0">
            <a class="btn btn-terracotta w-100" th:href="@{/pedido(producto=${p.nombre})}">
              <i class="bi bi-cart-plus me-1"></i> Encargar
            </a>
          </div>
        </div>
      </div>

      <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(productos)}">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        Todavía no hay productos registrados en el catálogo.
      </div>
    </div>

    <!-- Mensaje mostrado por JavaScript cuando ningún producto pasa el filtro -->
    <div class="col-12 text-center text-muted py-5 d-none" id="sinResultados">
      <i class="bi bi-search fs-1 d-block mb-2"></i>
      No encontramos productos que coincidan con tu búsqueda.
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
