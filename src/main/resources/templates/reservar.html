<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Catering y Eventos')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('reservar')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <h2 class="font-serif fw-bold">Cotización de Catering y Buffets</h2>
            <p class="text-muted small">Atendemos matrimonios, quinceañeros y eventos corporativos en Ica.</p>
          </div>

          <div th:if="${error}" class="alert alert-danger small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
          </div>

          <form th:action="@{/reservar}" th:object="${pedido}" method="post">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="producto" class="form-label small fw-semibold">Tipo de Evento *</label>
                <select id="producto" th:field="*{producto}" class="form-select" required>
                  <option value="">Seleccionar...</option>
                  <option th:each="tipo : ${tiposEvento}" th:value="${tipo}" th:text="${tipo}">Tipo</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label for="invitados" class="form-label small fw-semibold">Número de Invitados *</label>
                <input type="number" id="invitados" name="invitados" class="form-control"
                       min="10" max="2000" placeholder="Ej. 100" required>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaEntrega" class="form-label small fw-semibold">Fecha del Evento *</label>
                <input type="date" id="fechaEntrega" th:field="*{fechaEntrega}" class="form-control" required>
              </div>

              <div class="col-12 col-md-6">
                <label for="lugar" class="form-label small fw-semibold">Lugar / Local *</label>
                <input type="text" id="lugar" name="lugar" class="form-control"
                       placeholder="Ej. Club Campestre, Ica" required>
              </div>

              <div class="col-12">
                <label for="requerimientos" class="form-label small fw-semibold">
                  Requerimientos (Menú, Vajilla, Mozos)
                </label>
                <textarea id="requerimientos" name="requerimientos" class="form-control" rows="3"
                          placeholder="Indique si requiere servicio completo de banquetería..."></textarea>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-terracotta w-100 py-3 fw-bold">
                  <i class="bi bi-send me-2"></i> Enviar Solicitud de Cotización
                </button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div th:if="${mostrarModalAuth}"
       th:replace="~{fragments/layout :: modalAuth(
         'Necesitas una cuenta para cotizar tu evento',
         'Así podemos guardar tu solicitud en tu cuenta y que puedas revisar su estado cuando quieras.')}"></div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  <script th:if="${mostrarModalAuth}">
    document.addEventListener("DOMContentLoaded", function () {
      new bootstrap.Modal(document.getElementById("modalAuth")).show();
    });
  </script>

</body>
</html>
