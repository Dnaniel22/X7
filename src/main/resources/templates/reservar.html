<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Catering y Eventos')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('reservar')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <h2 class="font-serif fw-bold">Cotización de Catering y Buffets</h2>
            <p class="text-muted small">Atendemos matrimonios, quinceañeros y eventos corporativos en Ica.</p>
          </div>

          <!-- Formulario enlazado a CateringForm y validado con Spring Validator -->
          <form th:action="@{/reservar}" th:object="${catering}" method="post" novalidate>

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Revisa los campos marcados en rojo.
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="tipoEvento" class="form-label small fw-semibold">Tipo de Evento *</label>
                <select id="tipoEvento" th:field="*{tipoEvento}" class="form-select"
                        th:classappend="${#fields.hasErrors('tipoEvento')} ? 'is-invalid'" required>
                  <option value="">Seleccionar...</option>
                  <option th:each="tipo : ${tiposEvento}" th:value="${tipo}" th:text="${tipo}">Tipo</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tipoEvento')}" th:errors="*{tipoEvento}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="invitados" class="form-label small fw-semibold">Número de Invitados *</label>
                <input type="number" id="invitados" th:field="*{invitados}" class="form-control"
                       th:classappend="${#fields.hasErrors('invitados')} ? 'is-invalid'"
                       min="10" max="2000" placeholder="Ej. 100" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('invitados')}" th:errors="*{invitados}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaEvento" class="form-label small fw-semibold">Fecha del Evento *</label>
                <input type="date" id="fechaEvento" th:field="*{fechaEvento}" class="form-control"
                       th:classappend="${#fields.hasErrors('fechaEvento')} ? 'is-invalid'"
                       th:min="${fechaMinima}" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fechaEvento')}" th:errors="*{fechaEvento}">Error</div>
              </div>

              <div class="col-12 col-md-6">
                <label for="telefono" class="form-label small fw-semibold">Teléfono de Contacto *</label>
                <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                       placeholder="987654321" maxlength="9" inputmode="numeric" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Error</div>
              </div>

              <div class="col-12">
                <label for="lugar" class="form-label small fw-semibold">Lugar / Local *</label>
                <input type="text" id="lugar" th:field="*{lugar}" class="form-control"
                       th:classappend="${#fields.hasErrors('lugar')} ? 'is-invalid'"
                       placeholder="Ej. Club Campestre, Ica" maxlength="150" required>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('lugar')}" th:errors="*{lugar}">Error</div>
              </div>

              <div class="col-12">
                <label for="requerimientos" class="form-label small fw-semibold">
                  Requerimientos (Menú, Vajilla, Mozos)
                </label>
                <textarea id="requerimientos" th:field="*{requerimientos}" class="form-control" rows="3"
                          th:classappend="${#fields.hasErrors('requerimientos')} ? 'is-invalid'"
                          placeholder="Indique si requiere servicio completo de banquetería..." maxlength="500"></textarea>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('requerimientos')}" th:errors="*{requerimientos}">Error</div>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-terracotta w-100 py-3 fw-bold">
                  <i class="bi bi-send me-2"></i> Enviar Solicitud de Cotización
                </button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div th:if="${mostrarModalAuth}"
       th:replace="~{fragments/layout :: modalAuth(
         'Necesitas una cuenta para cotizar tu evento',
         'Así podemos guardar tu solicitud en tu cuenta y que puedas revisar su estado cuando quieras.')}"></div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  <script th:if="${mostrarModalAuth}">
    document.addEventListener("DOMContentLoaded", function () {
      new bootstrap.Modal(document.getElementById("modalAuth")).show();
    });
  </script>

</body>
</html>
