<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Catering y Eventos')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('reservar')}"></nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="card card-modern p-4">
          <div class="text-center mb-4">
            <h2 class="font-serif fw-bold">Cotización de Catering y Buffets</h2>
            <p class="text-muted small">Atendemos matrimonios, quinceañeros y eventos corporativos en Ica.</p>
          </div>

          <form th:action="@{/reservar}" th:object="${reservaForm}" method="post" novalidate>

            <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              Revisa los campos marcados en rojo antes de continuar.
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="tipoEvento" class="form-label small fw-semibold">Tipo de Evento *</label>
                <select id="tipoEvento" th:field="*{tipoEvento}" th:errorclass="is-invalid" class="form-select">
                  <option value="">Seleccionar...</option>
                  <option th:each="tipo : ${tiposEvento}" th:value="${tipo}" th:text="${tipo}">Tipo</option>
                </select>
                <div class="invalid-feedback" th:errors="*{tipoEvento}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="invitados" class="form-label small fw-semibold">Número de Invitados *</label>
                <input type="number" id="invitados" th:field="*{invitados}" th:errorclass="is-invalid"
                       class="form-control" min="10" max="2000" placeholder="Ej. 100">
                <div class="invalid-feedback" th:errors="*{invitados}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="fechaEvento" class="form-label small fw-semibold">Fecha del Evento *</label>
                <input type="date" id="fechaEvento" th:field="*{fechaEvento}" th:errorclass="is-invalid"
                       th:attr="min=${fechaMinima}" class="form-control">
                <div class="invalid-feedback" th:errors="*{fechaEvento}"></div>
              </div>

              <div class="col-12 col-md-6">
                <label for="lugar" class="form-label small fw-semibold">Lugar / Local *</label>
                <input type="text" id="lugar" th:field="*{lugar}" th:errorclass="is-invalid"
                       class="form-control" placeholder="Ej. Club Campestre, Ica">
                <div class="invalid-feedback" th:errors="*{lugar}"></div>
              </div>

              <div class="col-12">
                <label for="requerimientos" class="form-label small fw-semibold">
                  Requerimientos (Menú, Vajilla, Mozos)
                </label>
                <textarea id="requerimientos" th:field="*{requerimientos}" th:errorclass="is-invalid"
                          class="form-control" rows="3"
                          placeholder="Indique si requiere servicio completo de banquetería..."></textarea>
                <div class="invalid-feedback" th:errors="*{requerimientos}"></div>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-terracotta w-100 py-3 fw-bold">
                  <i class="bi bi-send me-2"></i> Enviar Solicitud de Cotización
                </button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div th:if="${mostrarModalAuth}"
       th:replace="~{fragments/layout :: modalAuth(
         'Necesitas una cuenta para cotizar tu evento',
         'Así podemos guardar tu solicitud en tu cuenta y que puedas revisar su estado cuando quieras.')}"></div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  <script th:if="${mostrarModalAuth}">
    document.addEventListener("DOMContentLoaded", function () {
      new bootstrap.Modal(document.getElementById("modalAuth")).show();
    });
  </script>

</body>
</html>
